<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barber Daily TikTok Checker</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6B4226">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BD Checker">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #F4E9DA;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #loading {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #F4E9DA; text-align: center; padding: 24px;
  }
  #loading img {
    width: 72px; height: 72px; border-radius: 16px; margin-bottom: 16px;
    box-shadow: 0 8px 24px rgba(60,36,18,0.2);
  }
  #loading .title { color: #3B2417; font-size: 17px; font-weight: 600; margin-bottom: 6px; }
  #loading .subtitle { color: #6B4226; font-size: 13px; }
  .spinner {
    margin-top: 18px; width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid #E8D5BC; border-top-color: #6B4226;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #fallback {
    margin-top: 22px;
  }
  #fallback a {
    display: inline-block; background: #6B4226; color: #FFF8F0; text-decoration: none;
    padding: 10px 26px; border-radius: 999px; font-weight: 500; font-size: 14px;
  }
  #fallback p { color: #6B4226; font-size: 12px; margin: 10px 0 0 0; }

  #install-btn {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: #6B4226; color: #FFF8F0; border: none; border-radius: 999px;
    padding: 12px 24px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 20px rgba(60,36,18,0.35);
    display: none; z-index: 20; cursor: pointer;
  }
</style>
</head>
<body>

<div id="loading">
  <img src="icon-192.png" alt="Barber Daily logo">
  <div class="title">Barber Daily TikTok Checker</div>
  <div class="subtitle">Opening your tracker...</div>
  <div class="spinner"></div>
  <div id="fallback">
    <a href="https://barberdailychecker.streamlit.app/">Open the app</a>
    <p>Not redirecting automatically? Tap above.</p>
  </div>
</div>

<button id="install-btn">Install App</button>

<script>
  // This page can't show the Streamlit app inside a frame (Streamlit
  // blocks that for security), so instead it briefly shows a branded
  // loading screen, then sends the browser straight to the real app.
  // Opened from an installed home-screen icon, this still opens full
  // screen like a real app — it just lands on the live site directly.

  var DEST = "https://barberdailychecker.streamlit.app/";

  // Register the service worker so the browser treats this as installable.
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }

  // Android / desktop Chrome: show a custom "Install App" button and give
  // the person a moment to tap it before redirecting away.
  var deferredPrompt = null;
  var installBtn = document.getElementById("install-btn");
  var redirectDelay = 900;

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = "block";
    redirectDelay = 4000; // give them time to notice the button
  });

  installBtn.addEventListener("click", function () {
    installBtn.style.display = "none";
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt = null;
    }
  });

  setTimeout(function () {
    window.location.replace(DEST);
  }, redirectDelay);
</script>

</body>
</html>
